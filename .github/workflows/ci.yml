name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    # Versión fija: ubuntu-latest está pasando a Ubuntu 26.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas + cobertura de reglas (mínimo 90 %)
        run: pytest -q --cov=app/rules --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend (vitest + build + anti-cruces)
    # Versión fija: Playwright todavía no instala Chromium en Ubuntu 26.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Prueba anti-cruces (1.000 diagramas, 0 choques)
        run: npm run test:e2e
