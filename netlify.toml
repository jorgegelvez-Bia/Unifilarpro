# Netlify (frontend). Guía paso a paso: docs/PUBLICAR.md
# Las claves de Supabase NO van aquí: se ponen en Netlify › Site configuration › Environment variables.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app es una sola página: cualquier dirección abre index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Para que la app instalada se actualice sola al publicar una versión nueva.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Archivos con huella en el nombre: no cambian nunca.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
